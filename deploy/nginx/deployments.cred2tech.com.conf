# nginx vhost for deployments.cred2tech.com
#
# Terminates TLS (Let's Encrypt, managed by Certbot) and reverse-proxies:
#   /              -> 127.0.0.1:8080   (Jenkins)
#   /chat-approval/ -> 127.0.0.1:8081  (this app, jenkins-chat-approval)
#
# The /chat-approval/ block carries a TRAILING SLASH on proxy_pass so nginx
# strips the /chat-approval/ prefix before forwarding. The app mounts its
# routes at root (POST /, POST /notify, POST /post, GET /healthz), so:
#   https://deployments.cred2tech.com/chat-approval/         -> app POST /
#   https://deployments.cred2tech.com/chat-approval/healthz  -> app GET  /healthz
# This must match CHAT_ACTION_URL in /etc/cred2tech/jenkins-chat-approval.env
# (CHAT_ACTION_URL=https://deployments.cred2tech.com/chat-approval/).
#
# Deploy:
#   sudo cp deployments.cred2tech.com.conf /etc/nginx/sites-available/deployments.cred2tech.com
#   sudo ln -sf /etc/nginx/sites-available/deployments.cred2tech.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: there used to be a separate, empty `jenkins` vhost that broke this
# route when it got blanked. Do NOT reintroduce it — the /chat-approval/
# location lives inside this file.

server {
    server_name deployments.cred2tech.com;

    location /chat-approval/ {
        proxy_pass http://127.0.0.1:8081/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deployments.cred2tech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deployments.cred2tech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = deployments.cred2tech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name deployments.cred2tech.com;
    return 404; # managed by Certbot
}
